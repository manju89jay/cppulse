# Existing GitLab jobs invoke the shared local developer facade.
# Compose remains explicit on a runner configured with Docker; this native job does not claim it.
stages:
- lint
- build
- test
- integration
variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.pip-cache
default:
  interruptible: true
workflow:
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_COMMIT_BRANCH
lint:cpp-format:
  stage: lint
  image: ubuntu:24.04
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends clang-format python3 python3-venv
  - python3 -m venv /opt/cppulse-dev
  - /opt/cppulse-dev/bin/python -m pip install ruff==0.2.1 black==24.1.1 jsonschema==4.21.1 packaging==26.3
  script:
  - /opt/cppulse-dev/bin/python tools/dev.py verify --scope changed --section format --output-dir review/ci/format
lint:python:
  stage: lint
  image: python:3.11-slim
  cache:
    key: pip-lint
    paths:
    - .pip-cache/
  script:
  - python -m pip install ruff==0.2.1 black==24.1.1 jsonschema==4.21.1 packaging==26.3
  - python tools/dev.py verify --scope changed --section generated --output-dir review/ci/generated
build:cpp:
  stage: build
  image: ubuntu:24.04
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends build-essential cmake libclang-dev llvm-dev
    nlohmann-json3-dev libspdlog-dev libcli11-dev libgtest-dev libgmock-dev
  - apt-get install -y --no-install-recommends python3 python3-venv
  - python3 -m venv /opt/cppulse-dev
  - /opt/cppulse-dev/bin/python -m pip install jsonschema==4.21.1 packaging==26.3
  script:
  - /opt/cppulse-dev/bin/python tools/dev.py verify --scope changed --section native --output-dir review/ci/native
  artifacts:
    paths:
    - analyzer-core/build/cppulse-analyzer
    - cli/build/cppulse
    - review/ci/native/
    expire_in: 1 hour
test:git-miner:
  stage: test
  image: python:3.11-slim
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends git
  - pip install -r git-miner/requirements.txt
  - python -m pip install packaging==26.3
  cache:
    key: pip-git-miner
    paths:
    - .pip-cache/
  script:
  - python tools/dev.py verify --scope changed --section python --component git-miner --output-dir review/ci/git-miner
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: review/ci/git-miner/git-miner-coverage.xml
    expire_in: 7 days
    paths:
    - review/ci/git-miner/
  coverage: /TOTAL.*\s(\d+%)/
test:predictor:
  stage: test
  image: python:3.11-slim
  before_script:
  - pip install -r predictor/requirements.txt
  - python -m pip install packaging==26.3
  cache:
    key: pip-predictor
    paths:
    - .pip-cache/
  script:
  - python tools/dev.py verify --scope changed --section python --component predictor --output-dir review/ci/predictor
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: review/ci/predictor/predictor-coverage.xml
    expire_in: 7 days
    paths:
    - review/ci/predictor/
  coverage: /TOTAL.*\s(\d+%)/
test:report-engine:
  stage: test
  image: python:3.11-slim
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0
    libffi-dev libcairo2
  - pip install -r report-engine/requirements.txt
  - python -m pip install packaging==26.3
  cache:
    key: pip-report-engine
    paths:
    - .pip-cache/
  script:
  - python tools/dev.py verify --scope changed --section python --component report-engine --output-dir
    review/ci/report-engine
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: review/ci/report-engine/report-engine-coverage.xml
    expire_in: 7 days
    paths:
    - review/ci/report-engine/
  coverage: /TOTAL.*\s(\d+%)/
build:dashboard:
  stage: build
  image: node:20-bookworm
  script:
  - npm ci --prefix dashboard
  - /opt/cppulse-dev/bin/python tools/dev.py verify --scope changed --section dashboard --output-dir review/ci/dashboard
  cache:
    key: npm-dashboard
    paths:
    - dashboard/node_modules/
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv
  - python3 -m venv /opt/cppulse-dev
  - /opt/cppulse-dev/bin/python -m pip install jsonschema==4.21.1 packaging==26.3
integration:
  stage: integration
  image: ubuntu:24.04
  needs:
  - build:cpp
  - test:git-miner
  - test:predictor
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends python3 python3-pip python3-venv git
    libclang-dev llvm-dev libspdlog-dev nlohmann-json3-dev libcli11-dev
  - python3 -m venv /opt/venv
  - . /opt/venv/bin/activate
  - pip install gitpython==3.1.41 pandas==2.2.0 numpy==1.26.4 xgboost==2.0.3 scikit-learn==1.4.0 joblib==1.3.2
    jsonschema==4.21.1
  - apt-get install -y --no-install-recommends cmake g++ libgtest-dev libgmock-dev libpango-1.0-0 libpangocairo-1.0-0
    libgdk-pixbuf-2.0-0 libffi-dev libcairo2
  - /opt/venv/bin/python -m pip install -e '.[dev,ml,pdf,web]' packaging==26.3 pypdf==7.1.0
  script:
  - /opt/venv/bin/python tools/dev.py verify --scope changed --section native --section integration --output-dir
    review/ci/integration
  artifacts:
    paths:
    - review/ci/integration/
    expire_in: 7 days
test:contracts:
  stage: test
  image: ubuntu:24.04
  before_script:
  - apt-get update && apt-get install -y --no-install-recommends python3 python3-venv git libpango-1.0-0
    libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev libcairo2 g++ libclang-dev llvm-dev libspdlog-dev
    nlohmann-json3-dev libcli11-dev
  - python3 -m venv /opt/cppulse-dev
  - /opt/cppulse-dev/bin/python -m pip install -e '.[dev,ml,pdf,web]' packaging==26.3 pypdf==7.1.0
  script:
  - /opt/cppulse-dev/bin/python tools/dev.py verify --scope changed --section root --output-dir review/ci/contracts
  artifacts:
    when: always
    paths:
    - review/ci/contracts/
