
# Pipeline outputs use a host bind mount (OUTPUT_PATH, default ./output).

# ── Services ──────────────────────────────────────────────────────────────────
services:

  # ── 1. analyzer-core (C++17 static analysis) ────────────────────────────
  analyzer-core:
    build:
      context: ./analyzer-core
      dockerfile: Dockerfile
    volumes:
      - ${REPO_PATH:-.}:/repo:ro
      - ${OUTPUT_PATH:-./output}:/output
    environment:
      - OUTPUT_DIR=/output
      - CPPULSE_CONFIG=${CPPULSE_CONFIG:-}
      - CPPULSE_PROFILE=${CPPULSE_PROFILE:-}
    command: ["--repo", "/repo", "--output", "/output"]

  # ── 2. git-miner (Python git history analysis) ──────────────────────────
  git-miner:
    build:
      context: .
      dockerfile: git-miner/Dockerfile
    volumes:
      - ${REPO_PATH:-.}:/repo:ro
      - ${OUTPUT_PATH:-./output}:/output
    environment:
      - OUTPUT_DIR=/output
    depends_on:
      analyzer-core:
        condition: service_completed_successfully
    command: ["python3", "-m", "src.main", "--repo", "/repo", "--output", "/output"]

  # ── 3. predictor (XGBoost ML pipeline) ──────────────────────────────────
  predictor:
    build:
      context: .
      dockerfile: predictor/Dockerfile
    volumes:
      - ${REPO_PATH:-.}:/repo:ro
      - ${OUTPUT_PATH:-./output}:/output
    environment:
      - OUTPUT_DIR=/output
      - CPPULSE_CONFIG=${CPPULSE_CONFIG:-}
      - CPPULSE_PROFILE=${CPPULSE_PROFILE:-}
    depends_on:
      analyzer-core:
        condition: service_completed_successfully
      git-miner:
        condition: service_completed_successfully
    command: ["--input", "/output", "--output", "/output"]

  # ── 4. report-engine (FastAPI + PDF) ────────────────────────────────────
  report-engine:
    build:
      context: .
      dockerfile: report-engine/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ${OUTPUT_PATH:-./output}:/output
    environment:
      - DATA_DIR=/output
    depends_on:
      predictor:
        condition: service_completed_successfully
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]

  report-pdf:
    build:
      context: .
      dockerfile: report-engine/Dockerfile
    volumes:
      - ${OUTPUT_PATH:-./output}:/output
    depends_on:
      predictor:
        condition: service_completed_successfully
    command: ["python3", "-m", "src.pdf_generator", "--data", "/output", "--output", "/output/report.pdf"]

  # ── 5. dashboard (React/TypeScript) ──────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - report-engine
